<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Student Form - GET & POST</title></head>
<body>
  <h2>Student Form using GET</h2>
  <form action="/submit-get" method="GET">
    Name: <input type="text" name="name" required><br><br>
    Branch: <input type="text" name="branch" required><br><br>
    Semester: <input type="number" name="semester" required><br><br>
    <button type="submit">Submit (GET)</button>
  </form>
  <hr>
  <h2>Student Form using POST</h2>
  <form action="/submit-post" method="POST">
    Name: <input type="text" name="name" required><br><br>
    Branch: <input type="text" name="branch" required><br><br>
    Semester: <input type="number" name="semester" required><br><br>
    <button type="submit">Submit (POST)</button>
  </form>
</body>
</html>
